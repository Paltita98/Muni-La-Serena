{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR - Nuevo Usuario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-8 page-shell flex items-center justify-center min-h-screen">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        
        <!-- HEADER ADMIN -->
        <div class="bg-slate-900 px-6 py-4 flex items-center justify-between">
            <h1 class="text-lg font-bold text-white">Registrar Nuevo Usuario</h1>
            <a href="{% url 'admin_dashboard_view' %}" class="text-slate-300 hover:text-white text-sm font-medium">✕ Cerrar</a>
        </div>

        <!-- FORMULARIO -->
        <form class="p-6 space-y-5">
            
            <div class="grid grid-cols-2 gap-5">
                <!-- RUT -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">RUT *</label>
                    <input type="text" required placeholder="Ej: 12.345.678-9" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <!-- Correo Institucional -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Correo Institucional *</label>
                    <input type="email" required placeholder="ejemplo@institucion.cl" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- Nombre Completo -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo *</label>
                <input type="text" required placeholder="Nombres y Apellidos" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Configuración de Permisos -->
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 grid grid-cols-2 gap-5 mt-2">
                <h3 class="col-span-2 text-sm font-bold text-slate-800 border-b border-slate-200 pb-2">Control de Acceso y Ámbito</h3>
                
                <!-- Rol -->
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Rol en el Sistema *</label>
                    <select required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Seleccione un rol...</option>
                        <option value="funcionario">Funcionario (Operativo)</option>
                        <option value="verificador">Verificador (Aprobador)</option>
                        <option value="delegado">Delegado (Líder)</option>
                        <option value="admin">Administrador Global</option>
                    </select>
                </div>

                <!-- Delegación Asignada -->
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Delegación *</label>
                    <select required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Seleccione ámbito...</option>
                        <option value="1">Global (Todas las delegaciones)</option>
                        <option value="2">Centro</option>
                        <option value="3">La Antena</option>
                        <option value="4">Las Compañías</option>
                        <option value="5">Avenida Del Mar</option>
                        <option value="6">La Pampa</option>
                        <option value="7">Rural</option>
                    </select>
                </div>

                <!-- Cargo (Depende de la delegación) -->
                <div class="col-span-2">
                    <label class="block text-xs font-medium text-gray-600 mb-1">Cargo / Función Específica *</label>
                    <select required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Seleccione el cargo (Determina sus metas)...</option>
                        <option value="social">Asistente Social</option>
                        <option value="territorial">Asistente Territorial</option>
                        <option value="admin_local">Administrativo de Delegación</option>
                    </select>
                </div>
            </div>

            <!-- BOTONES -->
            <div class="pt-4 flex justify-end space-x-3 border-t border-gray-100">
                <a href="{% url 'admin_dashboard_view' %}" class="px-4 py-2 text-sm font-medium text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">Cancelar</a>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm">Crear Usuario</button>
            </div>
        </form>
    </div>

</body>
</html>
