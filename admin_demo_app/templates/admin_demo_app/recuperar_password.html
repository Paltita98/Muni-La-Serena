{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR - Recuperar contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="page-shell flex items-center justify-center min-h-screen p-4 sm:p-8">
    <div class="w-full max-w-md bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">

        <!-- Cabecera con el mismo rojo del sidebar del administrador -->
        <div class="sidebar px-6 py-4 flex items-center justify-center border-b border-white/15">
            <img src="{% static 'images/la_serena.png' %}" alt="Logo Municipalidad de La Serena" class="brand-logo h-10">
        </div>

        <div class="p-6 space-y-5">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-gray-900">Recuperar contraseña</h1>
                <p class="text-sm text-gray-500 mt-1">Ingresa tu correo electrónico y te enviaremos un código de verificación para restablecer tu contraseña.</p>
            </div>

            {% for message in messages %}
                <div role="alert" class="rounded-lg border px-4 py-3 text-sm {% if message.tags == 'success' %}bg-green-50 border-green-200 text-green-700{% else %}bg-red-50 border-red-200 text-red-700{% endif %}">{{ message }}</div>
            {% endfor %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label for="recuperar-email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                    <input id="recuperar-email" type="email" name="email" autocomplete="email" placeholder="usuario@municipalidad.cl" required
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500">
                </div>
                <button type="submit" class="w-full bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-700 transition shadow-sm">Enviar instrucciones</button>
            </form>

            <div class="pt-4 border-t border-gray-100 text-center text-sm">
                <a href="/login/" class="text-red-600 font-medium hover:underline">Volver al login</a>
            </div>
        </div>
    </div>
</body>
</html>
