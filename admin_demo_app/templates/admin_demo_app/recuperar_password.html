{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
<div class="page-shell" style="display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div class="form-card" style="width: 100%; max-width: 400px; text-align: center; margin: 0;">
        <div class="form-body">
            <img src="{% static 'images/la_serena.png' %}" alt="Logo" style="margin: 0 auto 1rem; max-height: 80px;">
            <h2 style="margin: 0; color: var(--text-primary);">Sistema Municipal</h2>
            <p style="margin-top: 0; color: var(--text-muted); font-size: 0.85rem;">Gestión de Atención Ciudadana</p>
            
            <p style="font-size: 0.9rem; margin-top: 1.5rem; color: var(--text-primary);">Ingresa tu correo electrónico y te enviaremos<br>las instrucciones para recuperar tu contraseña.</p>
            
            <form method="POST" style="margin-top: 1.5rem; text-align: left;">
                {% csrf_token %}
                <div class="field" style="margin-bottom: 1.5rem;">
                    <label>Correo electrónico</label>
                    <input type="email" name="email" placeholder="usuario@municipalidad.cl" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar instrucciones</button>
            </form>
            
            <div style="margin-top: 1.5rem;">
                <a href="/login/" style="color: var(--primary); font-weight: 700; font-size: 0.9rem;">Volver al login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
