{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="page-shell">
<div class="page-shell" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
    <div class="form-card" style="width: 100%; max-width: 440px; margin: 0; overflow: hidden;">
        <div class="form-header primary" style="justify-content: center; padding: 1.1rem 1.5rem;">
            <img src="{% static 'images/la_serena.png' %}" alt="Logo Municipalidad" class="brand-logo" style="max-height: 46px; width: auto; margin: 0 auto; filter: brightness(0) invert(1);">
        </div>
        <div class="form-body" style="padding: 1.5rem;">
            <h2 style="margin: 0; color: var(--text-primary); text-align: center; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em;">Sistema Municipal</h2>
            <p style="margin: 0.35rem 0 0; color: var(--text-muted); font-size: 0.85rem; text-align: center;">Gestión de Atención Ciudadana</p>

            <p style="font-size: 0.9rem; margin-top: 1.5rem; color: var(--text-primary); text-align: center; line-height: 1.6;">Ingresa tu correo electrónico y te enviaremos las instrucciones para recuperar tu contraseña.</p>

            <form method="POST" style="margin-top: 1.5rem; text-align: left;">
                {% csrf_token %}
                <div class="field" style="margin-bottom: 1.5rem;">
                    <label>Correo electrónico</label>
                    <input type="email" name="email" placeholder="usuario@municipalidad.cl" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar instrucciones</button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="/login/" style="color: var(--primary); font-weight: 700; font-size: 0.9rem;">Volver al login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
