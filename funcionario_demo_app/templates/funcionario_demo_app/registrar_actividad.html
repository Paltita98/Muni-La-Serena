<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR - Registrar Actividad</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-8">

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        
        <!-- HEADER -->
        <div class="bg-blue-600 px-6 py-4 flex items-center justify-between">
            <h1 class="text-lg font-bold text-white">Registrar Nueva Actividad</h1>
            <a href="{% url 'funcionario_demo_view' %}" class="text-blue-100 hover:text-white text-sm font-medium">✕ Cerrar</a>
        </div>

        <!-- FORMULARIO -->
        <form class="p-6 space-y-5">
            
            <div class="grid grid-cols-2 gap-5">
                <!-- Fecha -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de la Actividad *</label>
                    <input type="date" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <!-- Ítem / Indicador -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ítem a Medir *</label>
                    <select required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Seleccione un indicador...</option>
                        <option value="1">Atención de casos sociales</option>
                        <option value="2">Visitas a terreno</option>
                        <option value="3">Reuniones de coordinación</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-5">
                <!-- Acción -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Acción *</label>
                    <select required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Seleccione acción...</option>
                        <option value="presencial">Atención Presencial</option>
                        <option value="telefonica">Atención Telefónica</option>
                        <option value="terreno">Salida a Terreno</option>
                    </select>
                </div>
                <!-- Evidencia (Opcional en el primer paso) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Adjuntar Evidencia (Foto/Doc)</label>
                    <input type="file" class="w-full text-sm text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                </div>
            </div>

            <!-- Descripción -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Descripción Detallada *</label>
                <textarea rows="3" required placeholder="Describa la actividad realizada..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <!-- Datos de Contacto -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 grid grid-cols-2 gap-5">
                <h3 class="col-span-2 text-sm font-bold text-gray-800">Datos del Ciudadano / Contacto</h3>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Nombre Completo</label>
                    <input type="text" placeholder="Ej: Juan Pérez" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Teléfono</label>
                    <input type="tel" placeholder="Ej: +56 9 1234 5678" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- BOTONES -->
            <div class="pt-4 flex justify-end space-x-3 border-t border-gray-100">
                <a href="{% url 'funcionario_demo_view' %}" class="px-4 py-2 text-sm font-medium text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">Cancelar</a>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm">Guardar y Generar Código ID</button>
            </div>
        </form>
    </div>

</body>
</html>
