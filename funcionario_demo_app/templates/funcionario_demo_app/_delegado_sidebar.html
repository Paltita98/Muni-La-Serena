{% load static %}
<aside class="sidebar w-64 shrink-0 text-white flex flex-col overflow-y-auto">
    <div class="min-h-20 shrink-0 flex flex-col items-start justify-center gap-1 px-4 py-2 border-b border-white/15">
        <img src="{% static 'images/la_serena.png' %}" alt="La Serena" class="brand-logo h-8">
        <span class="text-xs font-bold tracking-widest">DELEGADO</span>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1" aria-label="Navegación de delegación">
        <a href="{% url 'delegado_demo_view' %}" class="flex items-center px-3 py-2.5 rounded-lg transition {% if active_section == 'resumen' %}bg-red-900 text-white{% else %}text-red-100 hover:bg-red-800{% endif %}">Resumen</a>
        <a href="{% url 'delegado_actividades_view' %}" class="flex items-center px-3 py-2.5 rounded-lg transition {% if active_section == 'actividades' %}bg-red-900 text-white{% else %}text-red-100 hover:bg-red-800{% endif %}">Actividades</a>
        <a href="{% url 'delegado_atenciones_view' %}" class="flex items-center px-3 py-2.5 rounded-lg transition {% if active_section == 'atenciones' %}bg-red-900 text-white{% else %}text-red-100 hover:bg-red-800{% endif %}">Atención Social</a>
        <a href="{% url 'delegado_compromisos_view' %}" class="flex items-center px-3 py-2.5 rounded-lg transition {% if active_section == 'compromisos' %}bg-red-900 text-white{% else %}text-red-100 hover:bg-red-800{% endif %}">Agenda Colectiva</a>
        <a href="{% url 'delegado_equipo_view' %}" class="flex items-center px-3 py-2.5 rounded-lg transition {% if active_section == 'equipo' %}bg-red-900 text-white{% else %}text-red-100 hover:bg-red-800{% endif %}">Equipo</a>
    </nav>
    <div class="border-t border-white/15 px-4 py-3">
        <p class="text-xs font-semibold uppercase tracking-wide text-red-100">Delegación a cargo</p>
        <p class="mt-1 truncate text-sm font-medium text-white">{{ delegacion.nombre|default:"Sin delegación asignada" }}</p>
    </div>
    {% include 'main/_logout_button.html' %}
</aside>
