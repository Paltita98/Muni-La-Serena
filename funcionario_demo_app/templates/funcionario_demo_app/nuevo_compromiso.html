<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR - Nuevo Compromiso</title>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-8 page-shell">
    <div class="form-card">
        <div class="form-header dark">
            <h1 class="text-lg font-bold text-white">Registrar Nuevo Compromiso</h1>
            <a href="{% url 'funcionario_demo_view' %}" class="text-slate-300 hover:text-white text-sm font-medium">Cerrar</a>
        </div>
        <form method="post" class="form-body space-y-5">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
                    {{ field }}
                    {% for error in field.errors %}<p class="mt-1 text-xs text-red-600">{{ error }}</p>{% endfor %}
                </div>
            {% endfor %}
            {% if form.non_field_errors %}<div class="text-sm text-red-600">{{ form.non_field_errors }}</div>{% endif %}
            <div class="pt-4 flex justify-end gap-3 border-t border-gray-100">
                <a href="{% url 'funcionario_demo_view' %}" class="px-4 py-2 text-sm font-medium text-gray-600 bg-white border border-gray-300 rounded-lg">Cancelar</a>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-slate-800 rounded-lg shadow-sm">Guardar en agenda colectiva</button>
            </div>
        </form>
    </div>
</body>
</html>
