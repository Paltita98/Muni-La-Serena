{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR - Actividades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="page-shell">
    <div class="flex h-screen overflow-hidden">
        <aside class="sidebar w-64 text-white flex flex-col">
            <div class="h-16 flex items-center px-4 border-b border-white/15">
                <img src="{% static 'images/la_serena.png' %}" alt="La Serena" class="brand-logo">
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="{% url 'funcionario_demo_view' %}" class="flex items-center px-4 py-3 text-slate-200 hover:bg-white/10 rounded-lg transition">
                    <span>📊</span><span class="ml-3 font-medium">Mi Tablero</span>
                </a>
                <a href="{% url 'actividades_view' %}" class="flex items-center px-4 py-3 bg-white/10 text-white rounded-lg">
                    <span>📝</span><span class="ml-3 font-medium">Actividades</span>
                </a>
                <a href="{% url 'agenda_colectiva_view' %}" class="flex items-center px-4 py-3 text-slate-200 hover:bg-white/10 rounded-lg transition">
                    <span>📅</span><span class="ml-3 font-medium">Agenda Colectiva</span>
                </a>
                <a href="{% url 'mis_evidencias_view' %}" class="flex items-center px-4 py-3 text-slate-200 hover:bg-white/10 rounded-lg transition">
                    <span>📎</span><span class="ml-3 font-medium">Mis Evidencias</span>
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-gray-50">
            <header class="h-16 bg-white shadow-sm flex justify-between items-center px-8">
                <div class="w-96 relative">
                    <input type="text" id="searchInput" placeholder="Buscar actividad o código..." class="w-full bg-gray-100 text-sm rounded-full pl-4 pr-10 py-2 focus:outline-none focus:ring-2 focus:ring-red-500">
                    <span class="absolute right-3 top-2 text-gray-400">🔍</span>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="{% url 'registrar_actividad_view' %}" class="brand-button px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm inline-flex items-center">+ Registrar Actividad</a>
                </div>
            </header>

            <div class="page-content">
                <div class="section-header">
                    <div>
                        <h1>Actividades</h1>
                        <p>Historial, estado y seguimiento de cada actividad registrada.</p>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="search-box">
                        <input id="searchInputMobile" type="text" placeholder="Buscar por nombre o código">
                        <span class="icon">🔍</span>
                    </div>
                    <select id="statusFilter" class="filter-select" style="max-width: 220px;">
                        <option value="all">Todos los estados</option>
                        <option value="aprobada">Aprobada</option>
                        <option value="validando">Validando</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="rechazada">Rechazada</option>
                    </select>
                </div>

                <section class="list-panel">
                    <div class="list-header">
                        <h2>Listado de actividades</h2>
                        <span class="badge info" id="resultCount">0 resultados</span>
                    </div>
                    <div class="list-body">
                        <div id="activityList" class="activity-list"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    {{ actividades_json|json_script:"actividades-data" }}
    <script>
        const actividades = JSON.parse(document.getElementById('actividades-data').textContent);

        const stateLabels = {
            aprobada: { label: 'Aprobada', className: 'success' },
            en_correccion: { label: 'En corrección', className: 'warning' },
            pendiente: { label: 'Pendiente', className: 'info' },
            rechazada: { label: 'Rechazada', className: 'danger' }
        };

        const list = document.getElementById('activityList');
        const searchInput = document.getElementById('searchInput');
        const searchInputMobile = document.getElementById('searchInputMobile');
        const statusFilter = document.getElementById('statusFilter');
        const resultCount = document.getElementById('resultCount');

        function renderActivities() {
            const query = (searchInput.value || searchInputMobile.value || '').trim().toLowerCase();
            const filter = statusFilter.value;

            const filtered = actividades.filter(item => {
                const matchesQuery = item.titulo.toLowerCase().includes(query) || item.codigo.toLowerCase().includes(query);
                const matchesFilter = filter === 'all' || item.estado === filter;
                return matchesQuery && matchesFilter;
            });

            resultCount.textContent = `${filtered.length} resultado${filtered.length === 1 ? '' : 's'}`;

            if (!filtered.length) {
                list.innerHTML = '<div class="empty-state">No se encontraron actividades con ese criterio.</div>';
                return;
            }

            list.innerHTML = filtered.map(item => {
                const estado = stateLabels[item.estado];
                return `
                    <div class="activity-item">
                        <div class="activity-main">
                            <p class="activity-title">${item.titulo}</p>
                            <p class="activity-meta">Código: ${item.codigo} | ${item.fecha}</p>
                        </div>
                        <div class="activity-actions">
                            <span class="badge ${estado.className}">${estado.label}</span>
                            <a href="${item.url}" class="link-btn">Ver detalle</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        [searchInput, searchInputMobile].forEach(input => input.addEventListener('input', () => {
            searchInput.value = searchInput.value || searchInputMobile.value;
            searchInputMobile.value = searchInputMobile.value || searchInput.value;
            renderActivities();
        }));

        statusFilter.addEventListener('change', renderActivities);
        renderActivities();
    </script>
</body>
</html>
