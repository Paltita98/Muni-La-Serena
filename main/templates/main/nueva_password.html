{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Contraseña</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
<div class="page-shell" style="display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div class="form-card" style="width: 100%; max-width: 400px; margin: 0;">
        <div class="form-body">
            <h3 style="margin: 0 0 1.5rem 0; color: var(--text-primary); text-align: center;">Crea tu nueva contraseña</h3>

            {% if messages %}
                {% for message in messages %}
                    <p style="color: red; font-size: 0.85rem; text-align: center;">{{ message }}</p>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <label>Nueva contraseña</label>
                <input type="password" name="nueva_password" required style="width: 100%; margin-bottom: 1rem;">

                <label>Confirmar contraseña</label>
                <input type="password" name="confirmar_password" required style="width: 100%; margin-bottom: 1.5rem;">

                <button type="submit" class="btn btn-primary" style="width: 100%;">Guardar contraseña</button>
            </form>

            <div style="margin-top: 1.5rem; font-size: 0.85rem; text-align: center;">
                <a href="/login/" style="color: var(--primary); font-weight: 700;">Volver al login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
