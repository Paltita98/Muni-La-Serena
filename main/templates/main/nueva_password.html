{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR - Nueva contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="page-shell flex items-center justify-center min-h-screen p-4 sm:p-8">
    <div class="w-full max-w-md bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">

        <!-- Cabecera con el mismo rojo del sidebar del administrador -->
        <div class="sidebar px-6 py-4 flex items-center justify-center border-b border-white/15">
            <img src="{% static 'images/la_serena.png' %}" alt="Logo Municipalidad de La Serena" class="brand-logo h-10">
        </div>

        <div class="p-6 space-y-5">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-gray-900">Nueva contraseña</h1>
                <p class="text-sm text-gray-500 mt-1">Crea tu nueva contraseña y confírmala para finalizar la recuperación.</p>
            </div>

            <form method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label for="nueva-password" class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña</label>
                          <div class="flex gap-2">
                           <input id="nueva-password" type="password" name="nueva_password" autocomplete="new-password" minlength="8" pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{8,}" title="Usa al menos 8 caracteres, una mayúscula y un carácter especial." required aria-describedby="password-requirements"
                               class="min-w-0 flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500">
                           <button type="button" class="toggle-password border border-gray-300 rounded-lg px-3 text-sm" data-target="nueva-password" aria-label="Mostrar contraseña nueva" aria-pressed="false">Mostrar</button>
                          </div>
                          <p id="password-requirements" class="mt-1 text-xs text-gray-500">Usa al menos 8 caracteres, una mayúscula y un carácter especial.</p>
                </div>
                <div>
                    <label for="confirmar-password" class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
                          <div class="flex gap-2">
                           <input id="confirmar-password" type="password" name="confirmar_password" autocomplete="new-password" minlength="8" pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{8,}" title="Usa al menos 8 caracteres, una mayúscula y un carácter especial." required
                               class="min-w-0 flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500">
                           <button type="button" class="toggle-password border border-gray-300 rounded-lg px-3 text-sm" data-target="confirmar-password" aria-label="Mostrar confirmación de contraseña" aria-pressed="false">Mostrar</button>
                          </div>
                </div>
                <button type="submit" class="w-full bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-700 transition shadow-sm">Guardar contraseña</button>
            </form>

            <div class="pt-4 border-t border-gray-100 text-center text-sm">
                <a href="/login/" class="text-red-600 font-medium hover:underline">Volver al login</a>
            </div>
        </div>
    </div>
    <script>
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.target);
                const showing = input.type === 'password';
                input.type = showing ? 'text' : 'password';
                button.textContent = showing ? 'Ocultar' : 'Mostrar';
                button.setAttribute('aria-pressed', String(showing));
                button.setAttribute('aria-label', `${showing ? 'Ocultar' : 'Mostrar'} ${button.dataset.target === 'nueva-password' ? 'contraseña nueva' : 'confirmación de contraseña'}`);
            });
        });
    </script>
    {% include 'main/_sweetalerts.html' %}
</body>
</html>
