{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validar Código</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        .code-inputs { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 0.5rem; }
        .code-inputs input { width: 40px; height: 50px; text-align: center; font-size: 1.2rem; font-weight: bold; border-radius: 8px; border: 1px solid var(--border); }
        .code-inputs input:focus { border-color: var(--primary); outline: none; }
    </style>
</head>
<body>
<div class="page-shell" style="display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div class="form-card" style="width: 100%; max-width: 400px; text-align: center; margin: 0;">
        <div class="form-body">
            <h3 style="margin: 0 0 1.5rem 0; color: var(--text-primary);">Ingresa el código de verificación</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">
                Hemos enviado un código de 6 dígitos a:<br>
                <strong style="color: var(--text-primary);">{{ correo_destino }}</strong>
            </p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="code-inputs">
                    <input type="text" maxlength="1" name="d1" required autofocus>
                    <input type="text" maxlength="1" name="d2" required>
                    <input type="text" maxlength="1" name="d3" required>
                    <input type="text" maxlength="1" name="d4" required>
                    <input type="text" maxlength="1" name="d5" required>
                    <input type="text" maxlength="1" name="d6" required>
                </div>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1.5rem;">El código expira en 10 minutos.</p>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Verificar código</button>
            </form>
            
            <div style="margin-top: 1.5rem; font-size: 0.85rem;">
                <p class="help">¿No recibiste el código?<br>
                <a href="#" style="color: var(--primary); font-weight: 700;">Reenviar código</a></p>
                <br>
                <a href="/login/" style="color: var(--primary); font-weight: 700;">Volver al login</a>
            </div>
        </div>
    </div>
</div>
<!-- Script para que el foco salte automáticamente al siguiente input -->
<script>
    const inputs = document.querySelectorAll('.code-inputs input');
    inputs.forEach((input, index) => {
        input.addEventListener('input', () => {
            if (input.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        });
    });
</script>
</body>
</html>
