{% load static %}
<div class="px-4 pb-6">
    <form method="post" action="{% url 'main:logout_view' %}" data-swal-confirm data-confirm-title="¿Cerrar sesión?" data-confirm-text="Tu sesión se cerrará en este dispositivo." data-confirm-button="Cerrar sesión" data-cancel-text="Tu sesión continúa activa.">
        {% csrf_token %}
        <button type="submit" class="w-full flex items-center gap-3 px-4 py-3 text-red-100 hover:bg-red-800 rounded-lg transition text-left" aria-label="Cerrar sesión">
            <span aria-hidden="true">↪</span><span class="font-medium">Cerrar sesión</span>
        </button>
    </form>
    <script src="{% static 'js/sidebar-toggle.js' %}" defer></script>
</div>
<dialog id="app-form-dialog" class="m-auto h-[92vh] w-[min(96vw,1100px)] max-w-none overflow-hidden rounded-lg border border-gray-200 bg-white p-0 shadow-2xl backdrop:bg-black/50">
    <div class="flex h-full flex-col">
        <header class="flex min-h-14 items-center justify-between gap-4 border-b border-gray-200 px-4 py-2.5">
            <h2 id="app-form-title" class="truncate text-sm font-semibold text-gray-900">Formulario</h2>
            <button id="app-form-close" type="button" class="flex h-9 w-9 shrink-0 items-center justify-center rounded text-xl text-gray-600 hover:bg-gray-100" aria-label="Cerrar formulario" title="Cerrar">×</button>
        </header>
        <iframe id="app-form-frame" title="Formulario" class="min-h-0 w-full flex-1 border-0 bg-white"></iframe>
    </div>
</dialog>
<script src="{% static 'js/form-modal.js' %}" defer></script>
